<!doctype html>
<html dir="rtl"><head><meta charset="utf-8">
<style>@font-face{font-family:AmiriQ;src:url(../../web/fonts/amiri-quran.woff2)}body{margin:0;background:#fff}svg{display:block;width:512px;height:512px}</style></head><body>
<svg width="0" height="0" style="position:absolute"><defs>
  <linearGradient id="navy" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f1e35"/><stop offset=".55" stop-color="#1e3a5f"/><stop offset="1" stop-color="#2b5283"/></linearGradient>
  <linearGradient id="leather" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#20406a"/><stop offset="1" stop-color="#132a48"/></linearGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f6dc95"/><stop offset=".5" stop-color="#dcb45c"/><stop offset="1" stop-color="#b8892f"/></linearGradient>
  <linearGradient id="cream" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fffdf7"/><stop offset="1" stop-color="#efe5cf"/></linearGradient>
  <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".35"/></filter>
</defs></svg>

<!-- M1: closed Mushaf, navy leather cover, gold frame, the word in a gold shamsa (oval medallion) -->
<svg id="M1" viewBox="0 0 512 512">
  <rect width="512" height="512" fill="url(#navy)"/>
  <g filter="url(#sh)">
    <rect x="112" y="76" width="300" height="360" rx="16" fill="#0c1a2e"/>
    <rect x="104" y="70" width="296" height="360" rx="16" fill="url(#leather)"/>
    <rect x="356" y="70" width="44" height="360" rx="0" fill="#0f2240" opacity=".55"/>
  </g>
  <rect x="124" y="90" width="228" height="320" rx="8" fill="none" stroke="url(#gold)" stroke-width="6"/>
  <rect x="136" y="102" width="204" height="296" rx="4" fill="none" stroke="url(#gold)" stroke-width="2" opacity=".8"/>
  <g fill="url(#gold)"><circle cx="136" cy="102" r="7"/><circle cx="340" cy="102" r="7"/><circle cx="136" cy="398" r="7"/><circle cx="340" cy="398" r="7"/></g>
  <ellipse cx="238" cy="252" rx="96" ry="84" fill="url(#gold)"/>
  <ellipse cx="238" cy="252" rx="86" ry="74" fill="#16304f"/>
  <path d="M238 150 l10 12 -10 12 -10 -12z M238 330 l10 12 -10 12 -10 -12z" fill="url(#gold)"/>
  <text x="238" y="290" text-anchor="middle" font-family="AmiriQ" font-size="70" fill="#f6dc95">يَسَّرۡنَا</text>
</svg>

<!-- M2: the word as a sura-title cartouche on a cream Mushaf page with a gold border -->
<svg id="M2" viewBox="0 0 512 512">
  <rect width="512" height="512" fill="url(#navy)"/>
  <g filter="url(#sh)"><rect x="96" y="80" width="320" height="352" rx="18" fill="url(#cream)"/></g>
  <rect x="114" y="98" width="284" height="316" rx="10" fill="none" stroke="url(#gold)" stroke-width="8"/>
  <rect x="126" y="110" width="260" height="292" rx="6" fill="none" stroke="#1e3a5f" stroke-width="2.5" opacity=".7"/>
  <path d="M146 196 h220 a20 20 0 0 1 0 120 h-220 a20 20 0 0 1 0 -120z" fill="#1e3a5f"/>
  <path d="M146 196 h220 a20 20 0 0 1 0 120 h-220 a20 20 0 0 1 0 -120z" fill="none" stroke="url(#gold)" stroke-width="5"/>
  <text x="256" y="284" text-anchor="middle" font-family="AmiriQ" font-size="72" fill="#f6dc95">يَسَّرۡنَا</text>
  <g stroke="#c9a14a" stroke-width="5" stroke-linecap="round" opacity=".55">
    <path d="M150 148 H362"/><path d="M150 170 H362"/><path d="M150 344 H362"/><path d="M150 366 H362"/>
  </g>
</svg>

<!-- M3: open Mushaf, the word written across both pages -->
<svg id="M3" viewBox="0 0 512 512">
  <rect width="512" height="512" fill="url(#navy)"/>
  <g filter="url(#sh)">
    <path d="M256 150 C206 124 140 118 76 128 L76 372 C140 362 206 368 256 396 Z" fill="url(#cream)"/>
    <path d="M256 150 C306 124 372 118 436 128 L436 372 C372 362 306 368 256 396 Z" fill="url(#cream)"/>
  </g>
  <path d="M68 136 L68 384 C136 372 204 380 256 410 C308 380 376 372 444 384 L444 136" fill="none" stroke="url(#gold)" stroke-width="10" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M256 150 L256 396" stroke="#c9a14a" stroke-width="4"/>
  <text x="256" y="292" text-anchor="middle" font-family="AmiriQ" font-size="92" fill="#1e3a5f">يَسَّرۡنَا</text>
</svg>

<!-- M4: closed Mushaf in perspective-free gold, the word cut into it (strong at small sizes) -->
<svg id="M4" viewBox="0 0 512 512">
  <rect width="512" height="512" fill="url(#navy)"/>
  <g filter="url(#sh)">
    <rect x="104" y="84" width="304" height="344" rx="26" fill="url(#gold)"/>
  </g>
  <rect x="374" y="84" width="34" height="344" rx="0" fill="#b8892f" opacity=".55"/>
  <rect x="126" y="106" width="236" height="300" rx="14" fill="none" stroke="#1e3a5f" stroke-width="5" opacity=".75"/>
  <text x="244" y="286" text-anchor="middle" font-family="AmiriQ" font-size="86" fill="#1e3a5f">يَسَّرۡنَا</text>
</svg>
</body></html>
